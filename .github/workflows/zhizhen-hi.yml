name: 机器人智能响应
on:
  push:
  issue_comment:
    types: [created]

jobs:
  ai-assistant:
    # 只要评论里包含机器人名字（不管蓝不蓝）和“注册”两字就动
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'zhizhenassistant') && contains(github.event.comment.body, '注册'))
    
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取授权
        id: auth
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 机器人强行写 Java
        run: |
          # 强制指定路径
          PACKAGE_PATH="app/src/main/java/com/example/androiddemo"
          mkdir -p $PACKAGE_PATH
          
          # 覆盖生成 Java 文件
          cat <<EOF > $PACKAGE_PATH/LoginActivity.java
          package com.example.androiddemo;
          import android.os.Bundle;
          import android.util.Log;
          import androidx.appcompat.app.AppCompatActivity;

          public class LoginActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // 机器人留言：注册入口已在逻辑中预留
                  Log.d("zhizhenassistant", "老板，我已经根据你的评论指令增加了注册逻辑！");
              }
          }
          EOF

      - name: 提交并强制推送
        run: |
          git config --global user.name "zhizhenassistant[bot]"
          git config --global user.email "zhizhenassistant[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ steps.auth.outputs.token }}@github.com/${{ github.repository }}
          git add .
          git commit -m "🤖 BOT: 执行老板指令 - 增加注册入口" || echo "没有变化"
          git push origin HEAD:${{ github.ref }}
