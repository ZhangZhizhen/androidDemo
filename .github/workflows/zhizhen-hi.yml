🚀 让机器人说出第一句话
既然你是在学习 Android/iOS 开发，我们用最简单的方式：在你的仓库里创建一个“指令文件”。以后只要你一改代码，机器人就会跳出来。

1. 创建指令文件
回到你的仓库主页（点击仓库名字，比如那个计费数据库项目）。

点击 Add file -> Create new file（创建新文件）。

在文件名输入框（Name your file...）填入：
.github/workflows/zhizhen-hi.yml
(注意：.github 前面有个点，中间有斜杠，这代表文件夹路径)

2. 粘贴指令内容
把下面这段代码全部复制并粘贴到编辑框里：

YAML
name: 机器人入职致辞
on:
  push:     # 只要你往这个项目推代码，它就干活
  pull_request: # 只要你发起合并请求，它也干活

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: 获取机器人授权
        id: get_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 机器人开口说话
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.get_token.outputs.token }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number || 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "👋 报告老板 @ZhangZhizhen ！\n\n我是你的 zhizhenassistant。我已经成功入职这个项目！\n\n以后你的 Android/iOS 代码打包、发布，都可以交给我来盯着。🚀"
            })
