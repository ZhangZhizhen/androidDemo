name: 机器人智能响应
on:
  # 保留 push 触发周报的功能
  push:
  # 增加监听 Issue 评论的功能
  issue_comment:
    types: [created]

jobs:
  ai-assistant:
    # 只有当你本人发出的评论中包含 "@zhizhenassistant[bot]" 和 "注册" 关键字时才执行
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'issue_comment' && 
       contains(github.event.comment.body, '@zhizhenassistant[bot]') && 
       contains(github.event.comment.body, '注册'))
    
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取授权
        id: auth
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 机器人修改代码 (增加注册入口)
        run: |
          PACKAGE_PATH="app/src/main/java/com/example/androiddemo"
          RES_PATH="app/src/main/res/layout"
          
          # 1. 修改布局：增加一个注册按钮
          # 我们直接重写布局，增加一个 ID 为 btn_register 的按钮
          cat <<EOF > $RES_PATH/activity_login.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="16dp">
              <Button
                  android:id="@+id/btn_login"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="登录" />
              <Button
                  android:id="@+id/btn_register"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:text="新用户注册" />
          </LinearLayout>
          EOF

          # 2. 修改 Java 代码：增加注册按钮的点击监听
          cat <<EOF > $PACKAGE_PATH/LoginActivity.java
          package com.example.androiddemo;
          import android.os.Bundle;
          import android.util.Log;
          import android.view.View;
          import android.widget.Button;
          import androidx.appcompat.app.AppCompatActivity;

          public class LoginActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_login);

                  // 登录逻辑
                  findViewById(R.id.btn_login).setOnClickListener(v -> {
                      Log.d("zhizhenassistant", "登录按钮点击");
                  });

                  // 机器人新增：注册逻辑
                  findViewById(R.id.btn_register).setOnClickListener(v -> {
                      Log.d("zhizhenassistant", "老板，用户点击了注册入口！");
                  });
              }
          }
          EOF

      - name: 机器人提交代码
        run: |
          git config --global user.name "zhizhenassistant[bot]"
          git config --global user.email "zhizhenassistant[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ steps.auth.outputs.token }}@github.com/${{ github.repository }}
          git add .
          git diff-index --quiet HEAD || git commit -m "🤖 BOT: 根据老板指令增加注册入口"
          git push

      - name: 回复老板
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "报告老板！@ZhangZhizhen 注册入口已加好，代码已推送到仓库。请执行 `git pull` 验收！🚀"
            })
