name: 机器人入职致辞及代码质检
on:
  push:
  pull_request:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查自杀逻辑 (5/0)
        id: check_code
        # 注意：这里加了 || true 是为了防止这一步报错直接把整个流程卡死
        run: |
          if grep -r "5/0" .; then
            echo "DETECTED=true" >> $GITHUB_ENV
            echo "发现错误，准备报警"
            exit 1
          else
            echo "DETECTED=false" >> $GITHUB_ENV
            echo "代码洁净，准备表扬"
          fi

      - name: 获取机器人授权
        # 关键点：不管上面 grep 有没有报错，这一步都要执行
        if: always() 
        id: get_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 机器人开口说话
        # 关键点：不管前面红没红，机器人都要出来评价
        if: always() && steps.get_token.outputs.token
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.get_token.outputs.token }}
          script: |
            const hasError = process.env.DETECTED === 'true';
            const message = hasError 
              ? "🚨 **警报老板 @ZhangZhizhen ！**\n\n我在代码里抓到了 **`5/0`** 这种必崩的逻辑！我是你的 zhizhenassistant，建议你在本地修复后再推送。🛑" 
              : "👋 报告老板 @ZhangZhizhen ！\n\n我是你的 zhizhenassistant。我已经成功入职！刚才扫了一圈代码，没发现明显的自杀逻辑，干得漂亮！🚀";

            github.rest.issues.createComment({
              issue_number: 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })
