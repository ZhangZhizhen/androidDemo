GitHub App 如何设置权限？

Gemini 说
设置 GitHub App 的权限（Permissions）是整个开发过程中最关键的一步。作为 Android/iOS 开发者，你可以把它类比为 Android 的 AndroidManifest.xml 声明权限 或者 iOS 的 Info.plist 隐私描述。

设置权限的核心原则是：最小权限原则（Least Privilege）。只给它完成任务所必须的权力。

🛠️ 设置路径
进入你的 GitHub App 设置页面。

在左侧边栏找到 Permissions & events（权限与事件）。

你会看到三大类权限：Repository permissions（仓库权限）、Organization permissions（组织权限）和 Account permissions（个人账户权限）。

1. 针对移动端开发的常见权限配置
根据你想让这个 App 干什么，你可以参考下表进行勾选：

你的需求场景	建议勾选的权限	对应的订阅事件 (Events)
自动回复 Issue/咨询	Issues: Read & write	Issue comment
代码评审 (Code Review)	Pull requests: Read & write	Pull request
管理依赖 (Gradle/Pods)	Contents: Read & write	Push
自动化打包/发布 APK	Actions: Read & write	Workflow run
监控项目进度/看板	Projects: Read & write	Project card
2. 关键权限详解（开发者必看）
Contents (内容):

Read-only: 只能看代码（适合做静态扫描工具）。

Read & write: 允许 App 提交代码（适合自动修复 Bug 或更新依赖版本）。

Metadata (元数据):

这是一个必选且默认开启的权限，允许 App 获取仓库的基本信息（如名字、星数）。

Webhooks (钩子):

如果你希望 App 能在某些事情发生时实时收到通知，记得在下方的 "Subscribe to events" 区域勾选对应的复选框。

3. 设置完权限后的“深坑”提醒 ⚠️
作为开发者，这里有两个你必须知道的逻辑：

必须要点“Save”： 每次修改完权限，一定要滑到页面最下方点击 Save changes。

重新授权（最重要！）：

当你修改了一个已经安装在仓库里的 App 权限后，GitHub 会向安装该 App 的用户（你自己）发一封邮件。

App 不会自动获得新权限。你需要去 Installed GitHub Apps 页面，点击那个 App 的 Configure，然后点击顶部的提示按钮 Accept new permissions。如果不点这个，你的代码调用 API 时会报 403 Forbidden。

