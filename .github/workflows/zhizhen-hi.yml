1. 为什么选 GitHub App 而不是 PAT？
作为开发者，你一定能理解“权限控制”的重要性：

维度	Personal Access Token (PAT)	GitHub App
身份绑定	绑定你的个人账号（如果你离职，Token 就废了）。	独立身份。以 App 机器人名义运行，不占席位。
权限细粒度	只能选大类权限（如 repo 读写）。	极其精细。可以只给“读取 Issues”或“写入 PR”权限。
安全性	Token 永久有效（除非过期）。	短效 Token。每次通过私钥生成，即便泄露也只有 1 小时有效期。
频率限制	共享你的个人 API 额度。	独立额度。根据安装的仓库数自动扩容。
