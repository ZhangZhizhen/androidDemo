作为开发者，最爽的瞬间不是配置权限，而是当你点击 git push 后，你的 GitHub App 像个勤奋的机器人一样，自动跳出来帮你检查代码、跑 Gradle 任务、甚至把打好的 APK 递到你面前。

为了让你真正体验到这种“自动化服务”的快感，我们不需要写复杂的后端服务器，直接用 GitHub Actions 配合你刚创建的这个 App 玩个简单的。

🚀 实战体验：让你的 App 自动在 PR 下“查岗”
这个实验能让你看到：你的 App 是如何利用你刚才生成的 Key，代表它自己去你的仓库里“指点江山”的。

1. 准备工作
App ID: 在你的 App 设置页 General 顶部。

Private Key: 就是你下载的那个 .pem 文件。

2. 把 App 的“身份证”存进仓库
为了安全，不要把 .pem 文件直接传到代码里。

去你的 Android/iOS 练习仓库 -> Settings -> Secrets and variables -> Actions。

新建一个 Secret：名称叫 APP_PRIVATE_KEY，内容把整个 .pem 文件的文本粘贴进去。

再建一个 Secret：名称叫 APP_ID，填入你的 App ID。

3. 写一个“自动化指令” (Workflow)
在你的项目根目录创建文件：.github/workflows/app-greeting.yml，粘贴以下代码：

YAML
name: App Greeting
on:
  pull_request:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Create Token
        id: get_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: App Comment
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{ steps.get_token.outputs.token }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
          -d '{"body": "🚀 收到！我是你的 GitHub App 助手。我已经准备好为这个 Android/iOS 项目搬砖了！"}'
4. 见证奇迹的时刻
