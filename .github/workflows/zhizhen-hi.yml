name: 自动生成更新周报
on: [push]

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取内容
        id: logs
        run: |
          # 提取 feat 和 fix，如果没有则显示“无”
          F=$(git log --since="7 days ago" --grep="feat:" --pretty=format:"- %s" || echo "无新功能")
          B=$(git log --since="7 days ago" --grep="fix:" --pretty=format:"- %s" || echo "无 Bug 修复")
          
          # 存入环境变量（最稳妥的写法）
          echo "FEATS=$F" >> $GITHUB_ENV
          echo "FIXES=$B" >> $GITHUB_ENV

      - name: 授权
        id: auth
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 汇报
        if: always() # 无论成败，强制机器人现身
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const body = `### 📅 本周开发简报\n\n**✨ 新功能：**\n${process.env.FEATS || '无'}\n\n**🐛 修复：**\n${process.env.FIXES || '无'}`;
            github.rest.issues.createComment({
              issue_number: 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
