权限项	作用
Secrets (你截图里的)	选 Read & write。用来存储你的 Android 签名证书 (Keystore) 和别名密码，这样打包脚本才能拿到这些敏感信息进行签名。
Actions	触发 gradlew assembleRelease 任务。
Contents	把打包好的 Release 版 APK 挂在 GitHub 的发布页上。
