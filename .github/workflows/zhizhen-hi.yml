name: 自动生成更新周报
on: [push]

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取内容
        id: vars
        run: |
          # 提取 feat 和 fix，用逗号连接成一行，防止格式崩掉
          F_LOGS=$(git log --since="7 days ago" --grep="feat:" --pretty=format:"%s" | tr '\n' ',' || echo "暂无")
          B_LOGS=$(git log --since="7 days ago" --grep="fix:" --pretty=format:"%s" | tr '\n' ',' || echo "暂无")
          
          echo "FEATS=$F_LOGS" >> $GITHUB_ENV
          echo "FIXES=$B_LOGS" >> $GITHUB_ENV

      - name: 授权
        id: auth
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 汇报
        if: always()
        uses: actions/github-script@v7
        with:
          # 这里的 github-token 必须准确对应上面生成的 token
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const feats = process.env.FEATS.split(',').filter(i => i).map(i => '- ' + i).join('\n') || '暂无';
            const fixes = process.env.FIXES.split(',').filter(i => i).map(i => '- ' + i).join('\n') || '暂无';
            
            const body = `## 📅 zhizhenassistant 项目周报\n\n### ✨ 新增功能\n${feats}\n\n### 🐛 修复记录\n${fixes}\n\n--- \n*老板 @ZhangZhizhen，这是我为您整理的最新进展。*`;
            
            await github.rest.issues.createComment({
              issue_number: 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
