把下面这段“工作指令”直接粘贴进去：

YAML
name: 自动打招呼机器人
on:
  push:     # 当你推送代码时触发
  pull_request:
    types: [opened] # 当你发起合并请求时触发

jobs:
  say_hi:
    runs-on: ubuntu-latest
    steps:
      - name: 获取 App 授权
        id: get_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 让机器人留言
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{ steps.get_token.outputs.token }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number || 1 }}/comments \
          -d '{"body": "🚀 报告老板！zhizhenassistant 已就位，准备好处理 Google 计费数据库项目了！"}'
点击右上角的 Commit changes（提交）。

