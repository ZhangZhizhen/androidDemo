依赖库监控： 专门写一个 App 监控你的 Podfile 或 build.gradle，发现有库更新了，自动给你提一个 PR 并附上更新说明。

真机测试状态回传： 如果你有本地的测试设备，GitHub App 可以作为中转，把测试报告直接评论在对应的 Pull Request 下面。

