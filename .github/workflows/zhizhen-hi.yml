清灰换硅脂： 十几年的老机子，硅脂肯定干了。清理一下能让它在高强度跑 FFmpeg 时不至于降频卡死。

更换电池： 如果电池鼓包或循环上千次，花百来块换个第三方电池，它依然是全家最轻便的“随手查资料神器”。

